# schema: https://scanner.dev/schema/scanner-detection-rule.v1.json
name: Okta Identity Provider Created
description: |-
  Detects when a new identity provider is created for Okta.

  References:
  * https://developer.okta.com/docs/reference/api/system-log/
  * https://sec.okta.com/articles/2023/08/cross-tenant-impersonation-prevention-and-detection

  False Positives:
  * When an admin creates a new, authorised identity provider.
severity: Medium
query_text: |-
  @scnr.source_type="okta:system"
  eventType=system.idp.lifecycle.create
  | stats
    min(@scnr.datetime) as firstTime,
    max(@scnr.datetime) as lastTime,
    count() as eventCount
    by
    severity,
    eventType,
    actor.id,
    actor.type,
    actor.alternateId,
    actor.displayName,
    outcome.result
time_range_s: 300
run_frequency_s: 60
event_sink_keys:
- medium_severity_alerts
tags:
- source.okta
- tactics.ta0003.persistence
- tactics.ta0004.privilege_escalation
- techniques.t1136.create_account
- techniques.t1078.valid_accounts
