# schema: https://scanner.dev/schema/scanner-detection-rule.v1.json
name: Okta User Account Locked Out
enabled: true
description: |-
  Detects when an user account is locked out.

  References:
  * https://developer.okta.com/docs/reference/api/system-log/
  * https://developer.okta.com/docs/reference/api/event-types/

  False Positives:
  * Unknown
severity: Medium
query_text: |-
  %ingest.source_type="okta:system"
  displayMessage: 'Max sign in attempts exceeded'
  | stats
    min(@scnr.datetime) as firstTime,
    max(@scnr.datetime) as lastTime,
    count() as eventCount
    by
    severity,
    eventType,
    actor.id,
    actor.type,
    actor.alternateId,
    actor.displayName,
    outcome.result
time_range_s: 300
run_frequency_s: 60
event_sink_keys:
- medium_severity_alerts
tags:
- source.okta
- tactics.ta0001.initial_access
- tactics.ta0006.credential_access
- techniques.t1110.brute_force
- techniques.t1078.valid_accounts
