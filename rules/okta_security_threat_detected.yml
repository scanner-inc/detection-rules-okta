# schema: https://scanner.dev/schema/scanner-detection-rule.v1.json
name: Okta Security Threat Detected
enabled: true
description: |-
  Detects when an security threat is detected in Okta.

  References:
  * https://okta.github.io/okta-help/en/prod/Content/Topics/Security/threat-insight/configure-threatinsight-system-log.htm
  * https://developer.okta.com/docs/reference/api/system-log/
  * https://developer.okta.com/docs/reference/api/event-types/
severity: Medium
query_text: |-
  %ingest.source_type="okta:system"
  eventType=security.threat.detected
  | stats
    min(timestamp) as firstTime,
    max(timestamp) as lastTime,
    count() as eventCount
    by
    severity,
    eventType,
    actor.id,
    actor.type,
    actor.alternateId,
    actor.displayName,
    outcome.result
time_range_s: 300
run_frequency_s: 60
event_sink_keys:
- medium_severity_alerts
tags:
- tactics.ta0001.initial_access
- tactics.ta0006.credential_access
- techniques.t1110.brute_force
- techniques.t1078.valid_accounts
