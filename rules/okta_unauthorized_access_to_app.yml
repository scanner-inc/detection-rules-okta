# schema: https://scanner.dev/schema/scanner-detection-rule.v1.json
name: Okta Unauthorized Access to App
enabled: true
description: |-
  Detects when unauthorized access to app occurs.

  References:
  * https://developer.okta.com/docs/reference/api/system-log/
  * https://developer.okta.com/docs/reference/api/event-types/

  False Positives:
  * User might of believe that they had access.
severity: Medium
query_text: |-
  @scnr.source_type="okta:system"
  displayMessage: 'User attempted unauthorized access to app'
  | stats
    min(@scnr.datetime) as firstTime,
    max(@scnr.datetime) as lastTime,
    count() as eventCount
    by
    severity,
    eventType,
    actor.id,
    actor.type,
    actor.alternateId,
    actor.displayName,
    outcome.result
time_range_s: 300
run_frequency_s: 60
event_sink_keys:
- medium_severity_alerts
tags:
- source.okta
- tactics.ta0001.initial_access
- tactics.ta0007.discovery
- techniques.t1078.valid_accounts
- techniques.t1518.software_discovery
