# schema: https://scanner.dev/schema/scanner-detection-rule.v1.json
name: Okta Network Zone Deactivated or Deleted
description: |-
  Detects when an Network Zone is Deactivated or Deleted.

  References:
  * https://developer.okta.com/docs/reference/api/system-log/
  * https://developer.okta.com/docs/reference/api/event-types/

  False Positives:
  * Unknown
severity: Medium
query_text: |-
  @scnr.source_type="okta:system"
  eventType=(
    zone.deactivate
    zone.delete
  )
  | stats
    min(@scnr.datetime) as firstTime,
    max(@scnr.datetime) as lastTime,
    count() as eventCount
    by
    severity,
    eventType,
    actor.id,
    actor.type,
    actor.alternateId,
    actor.displayName,
    outcome.result
time_range_s: 300
run_frequency_s: 60
event_sink_keys:
- medium_severity_alerts
tags:
- source.okta
- tactics.ta0005.defense_evasion
- tactics.ta0007.discovery
- techniques.t1562.impair_defenses
- techniques.t1526.cloud_service_discovery
