# schema: https://scanner.dev/schema/scanner-detection-rule.v1.json
name: Okta MFA Reset or Deactivated
enabled: true
description: |-
  Detects when an attempt at deactivating  or resetting MFA.

  References:
  * https://developer.okta.com/docs/reference/api/system-log/
  * https://developer.okta.com/docs/reference/api/event-types/

  False Positives:
  * If a MFA reset or deactivated was performed by a system administrator.
severity: Medium
query_text: |-
  %ingest.source_type="okta:system"
  eventType=(
    user.mfa.factor.deactivate
    user.mfa.factor.reset_all
  )
  | stats
    min(@scnr.datetime) as firstTime,
    max(@scnr.datetime) as lastTime,
    count() as eventCount
    by
    severity,
    eventType,
    actor.id,
    actor.type,
    actor.alternateId,
    actor.displayName,
    outcome.result
time_range_s: 300
run_frequency_s: 60
event_sink_keys:
- medium_severity_alerts
tags:
- source.okta
- tactics.ta0006.credential_access
- tactics.ta0005.defense_evasion
- techniques.t1111.two_factor_authentication_interception
