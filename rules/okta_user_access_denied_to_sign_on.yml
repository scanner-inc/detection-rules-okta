# schema: https://scanner.dev/schema/scanner-detection-rule.v1.json
name: Okta User Access Denied to Sign On
description: |-
  ## Goal
  Detect when a user is denied access to sign on to an app based on sign-on policy.

  ## Strategy
  Monitor specific Okta events to identify when a user is denied access:

  * application.policy.sign_on.deny_access

  ## Triage and Response
  1. Inspect the target array to understand the reason for access denial.
  2. Contact the user to confirm if they attempted to access the app or if their account may be compromised.
enabled: true
severity: Informational
query_text: |-
  %ingest.source_type:"okta:system"
  eventType:application.policy.sign_on.deny_access
  | groupbycount(actor.alternateId)
  | where @q.count > 0
time_range_s: 300
run_frequency_s: 60
event_sink_keys:
- informational_severity_alerts
tags:
- source.okta
- tactics.ta0001.initial_access
- tactics.ta0006.credential_access
- techniques.t1110.brute_force
- techniques.t1078.valid_accounts
