# schema: https://scanner.dev/schema/scanner-detection-rule.v1.json
name: Okta Admin Role Assignment Created
description: |-
  Detects when a new admin role assignment is created. Which could be a sign of privilege escalation or persistence

  References:
  * https://developer.okta.com/docs/reference/api/system-log/
  * https://developer.okta.com/docs/reference/api/event-types/

  False Positives:
  * Legitimate creation of a new admin role assignment
severity: Medium
query_text: |-
  @scnr.source_type="okta:system"
  eventType="iam.resourceset.bindings.add"
  | stats
    min(@scnr.datetime) as firstTime,
    max(@scnr.datetime) as lastTime,
    count() as eventCount
    by
    severity,
    eventType,
    actor.id,
    actor.type,
    actor.alternateId,
    actor.displayName,
    outcome.result
time_range_s: 300
run_frequency_s: 60
event_sink_keys:
- medium_severity_alerts
tags:
- source.okta
- tactics.ta0004.privilege_escalation
- techniques.t1078.valid_accounts
- techniques.t1098.account_manipulation
