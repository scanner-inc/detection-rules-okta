# schema: https://scanner.dev/schema/scanner-detection-rule.v1.json
name: Okta FastPass Phishing Detection
enabled: true
description: |-
  Detects when Okta FastPass prevents a known phishing site.

  References:
  * https://sec.okta.com/fastpassphishingdetection
  * https://developer.okta.com/docs/reference/api/system-log/
  * https://developer.okta.com/docs/reference/api/event-types/

  False Positives:
  * Unlikely
severity: High
query_text: |-
  %ingest.source_type="okta:system"
  eventType=user.authentication.auth_via_mfa
  outcome.reason: 'FastPass declined phishing attempt'
  outcome.result: 'FAILURE'
  | stats
    min(@scnr.datetime) as firstTime,
    max(@scnr.datetime) as lastTime,
    count() as eventCount
    by
    severity,
    eventType,
    actor.id,
    actor.type,
    actor.alternateId,
    actor.displayName,
    outcome.result
time_range_s: 300
run_frequency_s: 60
event_sink_keys:
- high_severity_alerts
tags:
- source.okta
- tactics.ta0001.initial_access
- tactics.ta0006.credential_access
- techniques.t1566.phishing
- techniques.t1111.two_factor_authentication_interception
