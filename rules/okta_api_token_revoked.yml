# schema: https://scanner.dev/schema/scanner-detection-rule.v1.json
name: Okta API Token Revoked
description: |-
  Detects when a API Token is revoked.

  References:
  * https://developer.okta.com/docs/reference/api/system-log/
  * https://developer.okta.com/docs/reference/api/event-types/

  False Positives:
  * Unknown
severity: Medium
query_text: |-
  @scnr.source_type="okta:system"
  eventType="system.api_token.revoke"
  | stats
    min(@scnr.datetime) as firstTime,
    max(@scnr.datetime) as lastTime,
    count() as eventCount
    by
    severity,
    eventType,
    actor.id,
    actor.type,
    actor.alternateId,
    actor.displayName,
    outcome.result
time_range_s: 300
run_frequency_s: 60
event_sink_keys:
- medium_severity_alerts
tags:
- source.okta
- tactics.ta0005.defense_evasion
- techniques.t1531.account_access_removal
