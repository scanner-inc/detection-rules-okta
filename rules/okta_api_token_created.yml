# schema: https://scanner.dev/schema/scanner-detection-rule.v1.json
name: Okta API Token Created
enabled: true
description: |-
  Detects when a API token is created

  References:
  * https://developer.okta.com/docs/reference/api/system-log/
  * https://developer.okta.com/docs/reference/api/event-types/

  False Positives:
  * Legitimate creation of an API token by authorized users
severity: Medium
query_text: |-
  %ingest.source_type="okta:system"
  eventType="system.api_token.create"
  | stats
    min(@scnr.datetime) as firstTime,
    max(@scnr.datetime) as lastTime,
    count() as eventCount
    by
    severity,
    eventType,
    actor.id,
    actor.type,
    actor.alternateId,
    actor.displayName,
    outcome.result
time_range_s: 300
run_frequency_s: 60
event_sink_keys:
- medium_severity_alerts
tags:
- source.okta
- tactics.ta0006.credential_access
- techniques.t1528.steal_application_access_token
- techniques.t1550.use_alternate_authentication_material
