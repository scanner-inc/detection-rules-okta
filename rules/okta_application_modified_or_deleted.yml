# schema: https://scanner.dev/schema/scanner-detection-rule.v1.json
name: Okta Application Modified or Deleted
enabled: true
description: |-
  Detects when an application is modified or deleted.

  References:
  * https://developer.okta.com/docs/reference/api/system-log/
  * https://developer.okta.com/docs/reference/api/event-types/

  False Positives:
  * Unknown
severity: Medium
query_text: |-
  %ingest.source_type="okta:system"
  eventType=(
    "application.lifecycle.update"
    "application.lifecycle.delete"
  )
  | stats
    min(@scnr.datetime) as firstTime,
    max(@scnr.datetime) as lastTime,
    count() as eventCount
    by
    severity,
    eventType,
    actor.id,
    actor.type,
    actor.alternateId,
    actor.displayName,
    outcome.result
time_range_s: 300
run_frequency_s: 60
event_sink_keys:
- medium_severity_alerts
tags:
- source.okta
- tactics.ta0003.persistence
- tactics.ta0005.defense_evasion
- tactics.ta0040.impact
- techniques.t1098.account_manipulation
- techniques.t1078.valid_accounts
